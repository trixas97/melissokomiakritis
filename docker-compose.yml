# Base stack: the app and its PostgreSQL. On the server, always apply it with an
# environment overlay (see docker-compose.uat.yml / docker-compose.prod.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d --wait
#
# Locally, `docker compose up -d postgres` also loads docker-compose.override.yml,
# which publishes Postgres on localhost for `npm run dev`.

services:
  app:
    build: .
    image: ghcr.io/trixas97/melissokomiakritis:latest
    # Parameterised rather than overridden per environment: Compose *concatenates*
    # `ports` across -f files instead of replacing them, so an overlay that set a
    # port would bind both and collide with the other stack.
    #
    # APP_BIND defaults to loopback, which is only reachable by a reverse proxy
    # running on the host itself. The server's Nginx Proxy Manager is a container
    # that addresses backends as http://<public-ip>:<port>, so it needs
    # APP_BIND=0.0.0.0 in the stack's .env. Keep the bind address in .env, never
    # hand-edited here, or the next file copy silently reverts it and the proxy
    # starts returning 502.
    #
    # Host ports on the shared server: labo 3000/3001, gtrichakis 3002/3003,
    # melissokomiakritis 3004 (production, the default) / 3005 (UAT).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3004}:3000"
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      DATABASE_URL: postgresql://payload:${POSTGRES_PASSWORD}@postgres:5432/frankbees
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Fail-closed: only docker-compose.prod.yml sets "production", so any
      # environment brought up from this file alone stays out of the index.
      SITE_ENV: ${SITE_ENV:-uat}
      # Each environment has its OWN R2 bucket — a deletion in one admin must
      # never remove the other's files.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # Gives `docker compose up --wait` a real readiness signal. /el renders from
    # the database, so healthy means migrated and serving. The long start period
    # covers first boot, which also seeds content and uploads the starting photos.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/el"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: frankbees
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d frankbees"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
